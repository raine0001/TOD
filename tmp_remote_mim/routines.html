<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MIM Routines</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    header, .nav-bar { text-align: center; padding: 0.5rem; }
    .nav-bar { font-size: 0.9rem; border-bottom: 1px solid #ccc; }
    .status { font-weight: bold; }
    .grid-row { display: flex; flex-wrap: wrap; padding: 1rem; gap: 1rem; }
    .col { background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 1rem; flex: 1; min-width: 300px; }
    .full-width { width: 100%; padding: 1rem; border-top: 1px solid #ccc; background: #f9f9f9; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: center; }
    button, input[type="range"], input[type="number"], input[type="text"], textarea { margin: 0.25rem 0; width: 100%; }
    h2, h3 { margin-top: 0; }
    .routine-controls { display: flex; gap: 1rem; margin-top: 0.5rem; }
    .timeline-wrapper { margin-top: 0.5rem; }
    .btn-row { display: flex; gap: 1rem; }
  </style>
</head>
<body>

<header>
  {% include 'navbar.html' %}
</header>

<div class="grid-row">
  <div class="col">
    <h3>⚙️ Servo Configuration</h3>
    <button id="goSafeBtn">📍 Go to Safe Position</button>
    <label for="moveSpeed">Move Duration (ms, higher = slower): <span id="moveSpeedVal">1200</span></label>
    <input type="range" id="moveSpeed" min="10" max="5000" step="10" value="1200">
    <div id="servoContainer"></div>
    <button onclick="handleAddNewServo()">➕ Add New Servo</button>
    <button id="recordBtn">🎥 Record Current Position</button>
    <div id="servoConfigEditorBody"></div>
  </div>

  <div class="col">
    <h3>📷 Live Camera</h3>
    <img src="/camera_feed" width="100%" style="border: 1px solid #ccc; border-radius: 6px;">
    <h3>🛠️ MIM Configuration Setup</h3>
    <button onclick="saveCurrentAs('safe_position')">💾 Save as Safe Position</button>
    <button onclick="saveCurrentAs('surface_scan')">📉 Save as Surface Scan</button>
    <button onclick="saveCurrentAs('object_scan')">🔍 Save as Object Scan</button>
    <label for="mountType">MIM Mount Type:</label>
    <select id="mountType" onchange="saveMountType()">
      <option value="table">Table</option>
      <option value="wall">Wall</option>
      <option value="tripod">Tripod</option>
      <option value="custom">Custom</option>
    </select>
    <button onclick="saveMountType()">💾 Save Mount Type</button>
    
  </div>

  <div class="col">
    <h3>📂 Saved Positions</h3>
    <button onclick="clearAllKeyframes()">Clear All Positions</button>
    <table id="savedPositionsTable">
      <thead>
        <tr><th>Step</th><th>Base</th><th>Shoulder</th><th>Elbow</th><th>Wrist</th><th>Hand</th><th>Claw</th><th>Actions</th></tr>
      </thead>
      <tbody id="savedPositionsTbody"></tbody>
    </table>
    <h4>▶ Routine Playback</h4>
    <div class="routine-controls">
      <button id="playBtn" onclick="resumePlayback()">▶</button>
      <button id="pauseBtn" onclick="togglePause()">⏸</button>
      <button id="stopBtn" onclick="stopPlayback = true;">⏹</button>
    </div>
    <div class="timeline-wrapper">
      <input type="range" id="routineTimeline" min="1" max="1" value="1" step="1" disabled>
    </div>
  </div>
</div>

<div class="full-width">
  <h3>📝 Save Loaded Positions as New Routine</h3>
  <form id="routineForm">
    <label for="routineName">Name:</label>
    <input type="text" id="routineName" required>
    <label for="routineDesc">Description:</label>
    <textarea id="routineDesc" rows="3"></textarea>
    <label for="groupDelay">Delay Between Steps (s):</label>
    <input type="number" id="groupDelay" min="0" value="1">
    <div class="btn-row">
      <button type="submit">💾 Save Routine</button>
      <button onclick="reverseRoutine('${safeName}')">↩️ Reverse</button>
    </div>
  </form>
</div>

<!-- Hidden containers -->
<div style="display:none;">
  <table id="objectMemoryTable">
    <thead>
      <tr><th>Label</th><th>Confidence</th><th>Center</th><th>Movable</th><th>Actions</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="objectMemoryStatus"></div>
  <div id="unknownObjectsTable"><tbody></tbody></div>
  <div id="routineList"></div>
</div>

<script>
function loadLastPosition() {
  fetch('/get_current_position')
    .then(res => res.json())
    .then(data => {
      const angles = data.angles || [90, 90, 90, 90, 90, 50];
      document.querySelectorAll('.servo-slider').forEach((slider, i) => {
        slider.value = angles[i];
        // Hydrate UI value silently on boot; do not emit input before serial is ready.
        const servoId = slider.getAttribute('data-servo');
        const display = document.getElementById(`value${servoId}`);
        if (display) display.textContent = angles[i];
        if (typeof window.updateServoDisplay === 'function') {
          window.updateServoDisplay(parseInt(servoId, 10), angles[i]);
        }
      });
    });
}
window.onload = () => {
  loadLastPosition();
  attachSliderListeners();
  fetch('/get_mim_config')
    .then(res => {
      if (!res.ok) {
        return { mount_type: 'table' };
      }
      return res.json();
    })
    .then(data => {
      document.getElementById('mountType').value = data.mount_type || 'table';
    })
    .catch(() => {
      document.getElementById('mountType').value = 'table';
    });
};
</script>
<script>
function attachSliderListeners() {
  document.querySelectorAll('.servo-slider').forEach((slider, i) => {
    if (slider.dataset.saveBound === '1') return;
    slider.dataset.saveBound = '1';
    slider.addEventListener('change', () => {
      savePositionFromSliders();
      const angles = Array.from(document.querySelectorAll('.servo-slider')).map(s => parseInt(s.value));
      fetch('/save_current_position', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ angles })
      }).then(() => {
        console.log('✅ Current position saved to last_position.json');
      });
    });
  });
}
</script>
<script>
function attachSliderListeners() {
  document.querySelectorAll('.servo-slider').forEach((slider, i) => {
    if (slider.dataset.saveBound === '1') return;
    slider.dataset.saveBound = '1';
    slider.addEventListener('change', () => {
      savePositionFromSliders();
      const angles = Array.from(document.querySelectorAll('.servo-slider')).map(s => parseInt(s.value));
      fetch('/save_current_position', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ angles })
      }).then(() => {
        console.log('✅ Current position saved to last_position.json');
      });
    });
  });
}
</script>
<script>
function savePositionFromSliders() {
  const angles = Array.from(document.querySelectorAll('.servo-slider')).map(s => parseInt(s.value));
  fetch('/save_current_position', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ angles })
  })
  .then(res => res.json())
  .then(data => console.log("✅ Saved angles:", data))
  .catch(err => console.error("❌ Save failed", err));
}

function saveCurrentAs(key) {
  const angles = Array.from(document.querySelectorAll('.servo-slider')).map(s => parseInt(s.value));
  fetch('/save_mim_config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key, value: angles })
  })
  .then(res => res.json())
  .then(data => console.log(`✅ Saved ${key}:`, data))
  .catch(err => console.error(`❌ Failed to save ${key}`, err));
}

function saveMountType() {
  const type = document.getElementById('mountType').value;
  fetch('/save_mim_config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: 'mount_type', value: type })
  })
  .then(res => res.json())
  .then(data => console.log("✅ Mount type saved:", data))
  .catch(err => console.error("❌ Failed to save mount type", err));
}
</script>



<script src="/static/control.js"></script>
</body>
</html>
